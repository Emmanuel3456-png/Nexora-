/* Moving Background Orbs */

@keyframes drift {
  0% {
    transform: translate(0, 0) scale(1);
  }

  25% {
    transform: translate(60px, -40px) scale(1.08);
  }

  50% {
    transform: translate(-30px, -80px) scale(0.95);
  }

  75% {
    transform: translate(-70px, 20px) scale(1.05);
  }

  100% {
    transform: translate(0, 0) scale(1);
  }
}

@keyframes drift2 {
  0% {
    transform: translate(0, 0) scale(1);
  }

  33% {
    transform: translate(-80px, 50px) scale(1.1);
  }

  66% {
    transform: translate(50px, 80px) scale(0.9);
  }

  100% {
    transform: translate(0, 0) scale(1);
  }
}

@keyframes floatUp {
  0% {
    transform: translateY(110vh) translateX(0) scale(0);
    opacity: 0;
  }

  10% {
    opacity: 0.8;
  }

  90% {
    opacity: 0.4;
  }

  100% {
    transform: translateY(-10vh) translateX(30px) scale(1.2);
    opacity: 0;
  }
}

@keyframes gridFloat {
  0% {
    transform: translate(0, 0);
  }

  100% {
    transform: translate(-50px, -50px);
  }
}

@keyframes shimmer {
  0% {
    background-position: -200% center;
  }

  100% {
    background-position: 200% center;
  }
}

@keyframes orbPulse {
  0%, 100% {
    transform: scale(1);
    filter: blur(0px);
  }

  50% {
    transform: scale(1.08);
    filter: blur(1px);
  }
}

@keyframes waveBar {
  0%, 100% {
    height: 12px;
  }

  50% {
    height: 36px;
  }
}

@keyframes typingDot {
  0%, 80%, 100% {
    opacity: 0.2;
    transform: scale(0.8);
  }

  40% {
    opacity: 1;
    transform: scale(1);
  }
}

.shimmer-text {
