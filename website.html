FEATURES (25+ TOOLS)
========================================
- Lesson Notes, Exam Questions, Lesson Plans
- Scheme of Work, Attendance, Timetable
- Report Comments, Quiz Maker, Grading
- CBT Practice (WAEC/JAMB/NECO), Homework Helper
- Career Guidance, Essay Writer, Summarizer
- Image Generation (Pollinations)
- Igbo / Yoruba / Hausa Dictionary
- Female Voice Assistant (Groq Powered)
- Past Questions Engine

========================================
INSTALLATION
========================================
1. Download APK from official site: nexora.team-phantom.sta
2. Enable Install Unknown Apps on Android 8.0+
3. Install NEXORA-v1.0.0.apk (18.5 MB)
4. Open App, Allow Mic for Voice
5. Add GROQ_API_KEY in settings if self-hosting

========================================
BUILD FROM SOURCE
========================================
Termux:
  pkg update && pkg install nodejs git -y

Clone:
  git clone https://github.com/team-phantom/nexora
  cd nexora && npm install

Deploy:
  vercel --prod --env GROQ_API_KEY=...

Build APK:
  eas build -p android --profile preview
